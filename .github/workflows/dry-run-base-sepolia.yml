name: Dry Run Base Sepolia Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile contract
        run: npm run compile
      - name: Run full test suite
        run: npm test

  base-sepolia-dry-run:
    needs: compile-and-test
    runs-on: ubuntu-latest
    env:
      BASE_SEPOLIA_RPC_URL: https://sepolia.base.org
      EXPECTED_CHAIN_ID: 84532
      DRY_RUN: YES
      DEPLOYMENT_OUTPUT_PATH: base-sepolia-dry-run.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read Base Sepolia and perform no-transaction dry run
        run: npx hardhat run scripts/base-deployer.js --network baseSepolia
      - name: Assert no transaction was sent and chain is Base Sepolia
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('base-sepolia-dry-run.json', 'utf8'));
          if (report.chainId !== 84532) throw new Error(`Wrong chain: ${report.chainId}`);
          if (report.transactionsSent !== 0) throw new Error('Dry run sent a transaction');
          if (report.rpcReachable !== true) throw new Error('RPC was not reachable');
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Upload dry-run report
        uses: actions/upload-artifact@v4
        with:
          name: base-sepolia-dry-run-report
          path: base-sepolia-dry-run.json
